<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b40000">
<title>Marea Roja Cuotas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f3f3;color:#222}
header{background:#b40000;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:25px}header p{margin:5px 0 0}
main{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
h2{margin-top:0;color:#b40000;font-size:20px}
input,select,button{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#b40000;color:white;border:0;font-weight:bold}
button.secondary{background:#333}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#eee;border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.paid{color:green;font-weight:bold}.pending{color:#c00;font-weight:bold}
.small{font-size:13px;color:#666}
@media(max-width:600px){.row,.stats{grid-template-columns:1fr}table{font-size:12px}}
</style>
</head>
<body>
<header><h1>⚽ MAREA ROJA CUOTAS</h1><p>Control mensual de pagos</p></header>
<main>
<div class="card">
<h2>📅 Mes seleccionado</h2>
<select id="month"></select>
<div class="stats">
<div class="stat">Jugadores<b id="total">0</b></div>
<div class="stat">Pagados<b id="paid">0</b></div>
<div class="stat">Pendientes<b id="pending">0</b></div>
</div>
</div>

<div class="card">
<h2>➕ Agregar jugador</h2>
<div class="row">
<input id="name" placeholder="Nombre y apellido">
<input id="category" placeholder="Categoría">
</div>
<button onclick="addPlayer()">Agregar jugador</button>
<p class="small">Los jugadores quedan guardados en este dispositivo.</p>
</div>

<div class="card">
<h2>💰 Pagos</h2>
<div style="overflow:auto">
<table>
<thead><tr><th>Jugador</th><th>Estado</th><th>Medio</th><th>Fecha</th><th></th></tr></thead>
<tbody id="list"></tbody>
</table>
</div>
</div>

<div class="card">
<h2>📊 Historial</h2>
<p class="small">Seleccioná otro mes arriba para ver sus pagos y estadísticas.</p>
<button class="secondary" onclick="exportData()">💾 Descargar respaldo</button>
</div>
</main>

<script>
const KEY='marea_roja_cuotas_v3';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{players:[],months:{}};
const monthEl=document.getElementById('month');

function monthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(k){
 const [y,m]=k.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function ensureMonth(k){
 if(!data.months[k]) data.months[k]={};
 data.players.forEach(p=>{if(!data.months[k][p.id])data.months[k][p.id]={paid:false,method:'',date:''}});
}
function populateMonths(){
 const current=monthKey();
 const keys=new Set(Object.keys(data.months)); keys.add(current);
 // incluir los últimos 12 meses para facilitar el historial
 let d=new Date(); for(let i=0;i<12;i++){keys.add(monthKey(d));d.setMonth(d.getMonth()-1)}
 monthEl.innerHTML=[...keys].sort().reverse().map(k=>`<option value="${k}">${monthLabel(k)}</option>`).join('');
 monthEl.value=current;
 ensureMonth(current); save();
}
function addPlayer(){
 const n=document.getElementById('name').value.trim();
 const c=document.getElementById('category').value.trim();
 if(!n){alert('Ingresá el nombre y apellido.');return}
 const id=Date.now().toString();
 data.players.push({id,name:n,category:c});
 ensureMonth(monthEl.value); save();
 document.getElementById('name').value='';document.getElementById('category').value='';
 render();
}
function toggle(id){
 ensureMonth(monthEl.value);
 const x=data.months[monthEl.value][id];
 x.paid=!x.paid;
 if(x.paid && !x.date)x.date=new Date().toLocaleDateString('es-AR');
 if(!x.paid){x.method='';x.date=''}
 save();render();
}
function setMethod(id,v){
 ensureMonth(monthEl.value);data.months[monthEl.value][id].method=v;save();
}
function removePlayer(id){
 if(confirm('¿Eliminar este jugador?')){data.players=data.players.filter(p=>p.id!==id);Object.values(data.months).forEach(m=>delete m[id]);save();render()}
}
function render(){
 const k=monthEl.value;ensureMonth(k);
 let paid=0;const tbody=document.getElementById('list');
 tbody.innerHTML='';
 data.players.forEach(p=>{
  const x=data.months[k][p.id];if(x.paid)paid++;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><b>${escapeHtml(p.name)}</b><br><span class="small">${escapeHtml(p.category||'')}</span></td>
  <td><button onclick="toggle('${p.id}')" style="margin:0;padding:7px;background:${x.paid?'green':'#777'}">${x.paid?'PAGADO':'PENDIENTE'}</button></td>
  <td><select onchange="setMethod('${p.id}',this.value)" ${!x.paid?'disabled':''}>
  <option value="">Medio</option><option ${x.method==='Efectivo'?'selected':''}>Efectivo</option>
  <option ${x.method==='Transferencia'?'selected':''}>Transferencia</option></select></td>
  <td>${x.date||'-'}</td><td><button class="secondary" onclick="removePlayer('${p.id}')" style="padding:7px">🗑️</button></td>`;
  tbody.appendChild(tr);
 });
 document.getElementById('total').textContent=data.players.length;
 document.getElementById('paid').textContent=paid;
 document.getElementById('pending').textContent=data.players.length-paid;
 save();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='marea-roja-respaldo.json';a.click();
}
monthEl.addEventListener('change',()=>{ensureMonth(monthEl.value);save();render()});
populateMonths();render();
</script>
</body>
</html>
